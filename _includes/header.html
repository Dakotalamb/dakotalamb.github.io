<header class="site-header">
  {% if page.nav == "home" %}
  <a class="brand-card" href="/" aria-label="{{ site.title }} home">
    <img src="/favicon.png" alt="">
    <span>
      <strong>FORGED DESTINY</strong>
      <small>GAMING</small>
    </span>
  </a>
  {% else %}
  <a class="brand" href="/" aria-label="{{ site.title }} home">
    <img src="/favicon.png" alt="">
    <div class="brand-text">FORGED DESTINY<span>GAMING</span></div>
  </a>
  {% endif %}

  <nav class="nav-links" aria-label="Main navigation">
    <a href="/"{% if page.nav == "home" %} class="active" aria-current="page"{% endif %}>Home</a>
    <a href="/games/"{% if page.nav == "games" %} class="active" aria-current="page"{% endif %}>Games</a>
    <a href="/creators/"{% if page.nav == "creators" %} class="active" aria-current="page"{% endif %}>Creators</a>
    <a href="/about/"{% if page.nav == "about" %} class="active" aria-current="page"{% endif %}>About</a>
    <a href="{{ site.discord_url }}" target="_blank" rel="noopener noreferrer">Discord</a>
    <a href="mailto:{{ site.contact_email }}">Contact</a>
    {% if page.nav == "hub" %}
    <a class="hub-link active" href="{{ site.creator_hub_url }}">Open Hub ↗</a>
    {% else %}
    <a class="hub-link" href="/creator-hub/">Creator Hub ↗</a>
    {% endif %}
  </nav>
</header>
